[workspace]
resolver = "2"
members = ["crates/adblock-core", "crates/storage", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
adblock-core = { path = "crates/adblock-core" }
storage = { path = "crates/storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
